# Fly.io deployment.
#
#   fly launch --no-deploy      # claims the app name, writes no secrets
#   fly secrets set ...         # see docs/DEPLOY.md; the database is Supabase
#   fly deploy --ha=false       # one machine: a second would run a second poller
#
# Railway users: delete this file and see docs/DEPLOY.md -- the Dockerfile and
# environment variables are identical, only the CLI differs.

app = "mailagent"
# Singapore, next to the Supabase project, so mail bodies at rest and in
# transit stay in one region (M15 task 1).
primary_region = "sin"

# The default is 5 seconds, shorter than one message's trip through the
# graph. A redeploy would kill the poller mid-message and strand a `claimed`
# ledger row that nothing picks up again.
kill_timeout = 120

# 512 MB is tight for LangGraph plus the Google clients; swap absorbs the
# peaks for less than the next memory size costs.
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  APP_ENV = "prod"
  # Single instance, so boot-time migration is safe. Revisit if this ever
  # scales past one machine -- concurrent boots would race.
  MIGRATE_ON_BOOT = "true"
  RUN_SCHEDULER = "true"

[http_service]
  internal_port = 8000
  force_https = true
  # The scheduler must keep running between webhook calls: an autostopped
  # machine polls no mail and fires no token-expiry warning.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      path = "/health"
      interval = "30s"
      timeout = "5s"
      grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
