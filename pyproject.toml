[project]
name = "mailagent"
version = "0.1.0"
description = "Agent that reads Gmail and proposes Calendar events, with human approval."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "apscheduler>=3.10",
    "fastapi>=0.115",
    "google-genai>=1.0",
    "httpx>=0.27",
    # Floors at the locked releases, caps below the next major. Parked approvals
    # live in Postgres in LangGraph's checkpoint format, so a major upgrade has
    # to be a deliberate migration, never a side effect of re-locking.
    "langgraph>=1.2.11,<2",
    "langgraph-checkpoint-postgres>=3.1.2,<4",
    "psycopg[binary,pool]>=3.2",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "cryptography>=43.0",
    # Windows ships no IANA tz database and slim Linux images often drop it, so
    # zoneinfo cannot resolve "Asia/Karachi" without this. Every timezone
    # conversion in app.extraction.payloads depends on it -- runtime, not dev.
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[tool.uv]
# The serializer behind the checkpoint format is a transitive dependency.
# Constrained here rather than promoted to a direct one, for the same reason
# as the LangGraph bounds above.
constraint-dependencies = ["langgraph-checkpoint>=4.2.0,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Plan docs contain illustrative Python snippets that are deliberately elided
# (`{ ... }`, one-line field groups). They are prose, not code to be gated.
extend-exclude = ["**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
# google-auth ships py.typed but leaves several methods unannotated
# (Credentials.to_json, from_authorized_user_info). Exempt calls *into* those
# packages rather than loosening strictness on our own modules.
untyped_calls_exclude = ["google", "googleapiclient"]

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.auth.*",
    "google.oauth2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs a reachable Postgres; skipped automatically when absent",
]
