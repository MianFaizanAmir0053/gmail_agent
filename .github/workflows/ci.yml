name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # Ledger behaviour is Postgres behaviour (ON CONFLICT, CHECK constraints).
      # Without a real server the integration tests skip silently and the
      # idempotency guarantee stops being verified.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mailagent
          POSTGRES_PASSWORD: mailagent
          POSTGRES_DB: mailagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailagent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # An exact release, not a major tag: setup-uv stopped publishing those at
      # v8, and its releases are immutable, so this tag cannot be moved.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy app tests

      - name: Test
        run: uv run pytest
        env:
          DATABASE_URL: postgresql://mailagent:mailagent@localhost:5432/mailagent
          TEST_DATABASE_URL: postgresql://mailagent:mailagent@localhost:5432/mailagent
          GEMINI_API_KEY: not-a-real-key

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t mailagent:ci .

  # The web app (M16). Node 24, because its tests are TypeScript run by
  # `node --test` with no test framework, which Node 24 does natively.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
